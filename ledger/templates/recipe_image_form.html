{% extends "base.html" %}
{% block content %}
  <h2>Add Image to Recipe</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Upload Image</button>
  </form>
  <p><a href="{% url 'recipe_detail' pk=view.kwargs.pk %}">Cancel and go back</a></p>
{% endblock %}
