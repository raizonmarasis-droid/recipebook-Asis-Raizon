{% extends 'base.html' %}

{% block content %}
    <h2>{{ recipe.name }}</h2>
    <ul>
        {% for ri in recipe.ingredients.all %}
            <li>
                <strong>{{ ri.ingredient.name }}</strong> - {{ ri.quantity }}
            </li>
        {% endfor %}
    </ul>
    <a href="{% url 'recipe_list' %}">Back to list</a>
{% endblock %}
